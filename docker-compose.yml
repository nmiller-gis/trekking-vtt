services:
  app:
    image: ${IMAGE:-ghcr.io/nmiller-gis/trekking-vtt:latest}
    build: .
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - ./data:/app/server/data
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

